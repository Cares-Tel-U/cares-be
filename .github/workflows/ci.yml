name: Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-typecheck:
    name: Typecheck & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client Engine
        run: npx prisma generate

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Execute Vitest Automated Test Suite (140 Tests)
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: super_secret_ci_test_jwt_key_cares_2026
        run: npm test

  docker-build-verification:
    name: Verify Docker Container Build
    needs: test-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cares-backend:latest
